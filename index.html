<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>出發前｜比賽打包清單</title>
<style>
:root{font-family:system-ui,'Microsoft JhengHei',sans-serif;color:#493b63;background:#f7f0ff;accent-color:#a77be8}*{box-sizing:border-box}body{margin:0}header,main{max-width:1100px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e5d9f2}.brand{font-weight:800;font-size:21px;color:#69518b}.tag{font-size:13px;color:#8b79a5}h1{font-size:clamp(32px,5vw,54px);letter-spacing:-2px;line-height:1.2;margin:14px 0}p{line-height:1.7;color:#526b60}.hero{padding:26px 0 32px}.eyebrow{color:#9870c8;font-size:13px;letter-spacing:2px;font-weight:700}.layout{display:grid;grid-template-columns:310px 1fr;gap:26px;align-items:start}.panel{background:#fffaff;border:1px solid #eadcf5;border-radius:20px;padding:24px;box-shadow:0 10px 30px #8063a512}h2{font-size:20px;margin:0 0 20px}label.field{display:block;font-size:14px;font-weight:600;margin:18px 0 7px}input,select,button{font:inherit}input[type=text],input[type=number],select{width:100%;border:1px solid #d9c9e9;border-radius:10px;padding:11px;background:#fff;color:#493b63}button{cursor:pointer;border:0;border-radius:10px;padding:12px 16px;background:#9270c7;color:white;font-weight:650}button:hover{filter:brightness(.94)}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #d98b37;outline-offset:3px}.generate{width:100%;margin-top:24px}.note{font-size:12px}.summary{background:linear-gradient(135deg,#8970bd,#b685ca 58%,#d49bb9);color:white;border-radius:16px;padding:22px;margin-bottom:18px}.summary p{color:#cde1d0;font-size:14px;margin:7px 0 14px}.summary strong{font-size:25px}.bar{height:7px;background:#ffffff30;border-radius:8px;overflow:hidden}.bar span{display:block;background:#f8e7a7;height:100%;transition:width .2s}.tools{display:flex;gap:12px;justify-content:space-between;align-items:center;margin:20px 0;font-size:14px;flex-wrap:wrap}.light{background:#f0e8fa;color:#684f87;font-size:13px}.group{margin-bottom:18px}.group h3{font-size:15px;margin:0;padding:12px 4px;border-bottom:1px solid #eee5f3;color:#745b91}.item{display:flex;gap:12px;align-items:center;padding:13px 4px;border-bottom:1px solid #f1ebf5;cursor:pointer}.item input{width:20px;height:20px;flex-shrink:0}.item.done span{text-decoration:line-through;color:#89968b}.item.skipped{opacity:.42}.skip-item{margin-left:auto;width:30px;height:30px;padding:0;border-radius:8px;background:#c74343;color:#fff;font-size:20px;line-height:1}.skip-item:hover{background:#a92f35}.skip-item.restore{background:#efe8f7;color:#725d87}.critical{background:#fff6e8;padding:10px 15px;border-radius:12px}.add{display:flex;gap:8px;margin-top:20px}.add input{min-width:0}.empty{padding:22px;color:#58745d}.footer{font-size:12px;margin:24px 0;color:#8b7b9a}#status{font-size:13px;min-height:22px;color:#765c94}.pill{font-size:11px;background:#e9dcb6;border-radius:20px;padding:3px 8px;margin-left:auto;white-space:nowrap}@media(max-width:750px){header,main{padding:20px}.layout{grid-template-columns:1fr}.tag{display:none}.hero{padding:18px 0 24px}}@media print{header,.hero,aside,.tools,.add,.footer,#status{display:none}.layout{display:block}.panel{border:0}.summary{color:black;background:white}.summary p{color:black}.item{break-inside:avoid}}
</style>
<header><div class="brand">出發前 <span style="color:#64816b;font-weight:400">/ Pack & Go</span></div><span class="tag">少一點擔心，多一點準備。</span></header>
<main><div class="hero"><div class="eyebrow">YOUR TRIP, ALL SET.</div><h1>行李再多，也能安心出發。</h1><p>把重要的東西記下來，剩下的，一項一項準備就好。</p></div>
<div class="layout"><aside class="panel"><h2>這次去哪裡？</h2><form id="tripForm"><label class="field" for="destination">目的地</label><select id="destination" required><option value="" selected disabled>請選擇目的地</option><option>基隆市</option><option>臺北市</option><option>新北市</option><option>桃園市</option><option>新竹市</option><option>新竹縣</option><option>苗栗縣</option><option>臺中市</option><option>彰化縣</option><option>南投縣</option><option>雲林縣</option><option>嘉義市</option><option>嘉義縣</option><option>臺南市</option><option>高雄市</option><option>屏東縣</option><option>宜蘭縣</option><option>花蓮縣</option><option>臺東縣</option><option>澎湖縣</option><option>金門縣</option><option>連江縣</option></select><div style="display:flex;gap:8px;margin-top:8px"><input id="newDestination" type="text" maxlength="40" placeholder="新增目的地" aria-label="新增目的地"><button id="addDestination" type="button" style="white-space:nowrap">新增</button></div><label class="field" for="days">旅行天數</label><input id="days" type="number" min="1" max="30" value="3" required><label class="field" for="purpose">出遊目的</label><select id="purpose"><option value="city" selected>城市旅遊</option><option value="business">商務出差</option><option value="hiking">戶外健行</option></select><div class="purpose-add" style="display:flex;gap:8px;margin-top:8px"><input id="newPurpose" type="text" maxlength="40" placeholder="新增出遊目的" aria-label="新增出遊目的"><button id="addPurpose" type="button" style="white-space:nowrap">新增</button></div><label class="field" for="weather">預期天氣</label><select id="weather"><option value="cool">偏涼</option><option value="hot">炎熱</option><option value="cold">寒冷</option><option value="rain">下雨</option></select><button class="generate" type="submit">產生我的清單 ↗</button><p class="note">天氣由你選擇。更新行程會建立新清單，並重設勾選與自訂物品。</p></form></aside>
<section class="panel" aria-label="打包清單"><div class="summary"><div id="tripTitle"></div><p id="tripDetail"></p><strong id="progress" aria-live="polite"></strong><div class="bar" role="progressbar" aria-label="打包完成度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="fill"></span></div></div><div class="tools"><label><input id="remaining" type="checkbox"> 只看還沒打包的物品</label><div><button class="light" id="copy" type="button">複製清單</button> <button class="light" id="print" type="button">列印</button></div></div><div id="list"></div><form class="add" id="addForm"><input id="custom" type="text" placeholder="還要帶什麼？例如：作品展示板" aria-label="新增物品名稱" maxlength="80" required><button type="submit">新增</button></form><p id="status" role="status"></p></section></div><p class="footer">你的清單儲存在此瀏覽器。競賽用品請依主辦單位規定確認。此工具依選項整理建議，沒有即時天氣或 AI 連線。</p></main>
<script>
const $=id=>document.getElementById(id),key='pack-go-v1';let state;
function create(trip){let items=[];const add=(group,names)=>names.forEach(name=>items.push({id:String(items.length),group,name,done:false,skipped:false}));add('出門前，先確認這三樣',['充電線（確認接頭相容）','身分證件','鑰匙']);add('證件與交通',['報到或住宿資料','車票與交通資訊','錢包與付款工具']);if(trip.purpose==='business')add('工作用品',['筆電及充電器','會議資料與簡報備份']);if(trip.purpose==='hiking')add('戶外用品',['登山鞋與適合路線的裝備','飲用水與行動糧','離線地圖']);add('衣物與盥洗',[`換洗上衣 ${Math.max(0,trip.days-1)} 件（另含身上穿的）`,`內衣褲 ${trip.days} 套`,'睡衣（住宿時）','牙刷、牙膏與個人盥洗用品','個人日常用藥（如需）']);const weather={cool:['薄外套','長褲'],hot:['透氣衣物','帽子與防曬用品'],cold:['保暖外套','保暖內層與圍巾'],rain:['雨傘或雨衣','行李防水袋']};add('天氣準備',weather[trip.weather]);add('隨身小物',['手機','行動電源','水壺','面紙']);return{trip,items};}
function formTrip(){return{destination:$('destination').value.trim()||'目的地',days:Number($('days').value),purpose:$('purpose').value,weather:$('weather').value};}
const baseDestinations='基隆市 臺北市 新北市 桃園市 新竹市 新竹縣 苗栗縣 臺中市 彰化縣 南投縣 雲林縣 嘉義市 嘉義縣 臺南市 高雄市 屏東縣 宜蘭縣 花蓮縣 臺東縣 澎湖縣 金門縣 連江縣'.split(' '),destinationKey='pack-go-destinations-v1';let customDestinations=[];try{const ds=JSON.parse(localStorage.getItem(destinationKey));if(Array.isArray(ds))customDestinations=ds.filter(x=>typeof x==='string').slice(0,30);}catch{}customDestinations.filter(x=>!baseDestinations.includes(x)).forEach(x=>{const o=document.createElement('option');o.textContent=x;o.value=x;document.getElementById('destination').append(o);});const basePurposes={city:'城市旅遊',business:'商務出差',hiking:'戶外健行'},purposeKey='pack-go-purposes-v1';let customPurposes=[];try{const ps=JSON.parse(localStorage.getItem(purposeKey));if(Array.isArray(ps))customPurposes=ps.filter(p=>p&&typeof p.id==='string'&&typeof p.name==='string').slice(0,30);}catch{}function purposeName(id){return basePurposes[id]||customPurposes.find(p=>p.id===id)?.name||'自訂行程';}customPurposes.forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=p.name;$('purpose').append(o);});try{const saved=JSON.parse(localStorage.getItem(key));if(saved&&saved.trip&&Array.isArray(saved.items)&&saved.items.every(x=>typeof x.name==='string'&&typeof x.group==='string')&&['cool','hot','cold','rain'].includes(saved.trip.weather)&&(Object.hasOwn(basePurposes,saved.trip.purpose)||customPurposes.some(p=>p.id===saved.trip.purpose))&&Number.isInteger(saved.trip.days)&&saved.trip.days>=1&&saved.trip.days<=30)state=saved;}catch{}if(!state){$('purpose').value='city';$('destination').value='';state=create({...formTrip(),destination:'請選擇目的地'});}for(const id of ['destination','days','purpose','weather'])$(id).value=state.trip[id];
function save(){try{localStorage.setItem(key,JSON.stringify(state));}catch{$('status').textContent='此瀏覽器無法儲存，關閉頁面前請複製清單。';}}
function render(){const active=state.items.filter(x=>!x.skipped),done=active.filter(x=>x.done).length,total=active.length,percent=total?Math.round(done/total*100):100;$('tripTitle').textContent=`${state.trip.destination} · ${state.trip.days} 天${state.trip.days-1} 夜`;$('tripDetail').textContent=`${purposeName(state.trip.purpose)} ／ ${{cool:'偏涼',hot:'炎熱',cold:'寒冷',rain:'下雨'}[state.trip.weather]}`;$('progress').textContent=total===0?'已略過所有清單項目':done===total?'全部準備好了，安心出發！':`已打包 ${done} / ${total} 項`;$('fill').style.width=percent+'%';document.querySelector('[role=progressbar]').setAttribute('aria-valuenow',percent);$('list').replaceChildren();const visible=state.items.filter(x=>!$('remaining').checked||(!x.done&&!x.skipped));for(const group of [...new Set(visible.map(x=>x.group))]){const section=document.createElement('section');section.className='group'+(group.startsWith('出門前')?' critical':'');const heading=document.createElement('h3');heading.textContent=group;section.append(heading);for(const item of visible.filter(x=>x.group===group)){const label=document.createElement('label');label.className='item'+(item.done?' done':'')+(item.skipped?' skipped':'');const check=document.createElement('input');check.type='checkbox';check.checked=item.done;check.addEventListener('change',()=>{item.done=check.checked;save();render();});const span=document.createElement('span');span.textContent=item.name;label.append(check,span);if(['衣物與盥洗','天氣準備','隨身小物'].includes(group)){const skip=document.createElement('button');skip.type='button';skip.className='skip-item'+(item.skipped?' restore':'');skip.textContent=item.skipped?'＋':'−';skip.setAttribute('aria-label',item.skipped?'恢復 '+item.name:'略過 '+item.name);skip.title=item.skipped?'恢復此項':'不需要此項';skip.addEventListener('click',()=>{item.skipped=!item.skipped;if(item.skipped)item.done=false;save();render();});label.append(skip);}section.append(label);}$('list').append(section);}if(!visible.length){const msg=document.createElement('p');msg.className='empty';msg.textContent='全部打包完成！出門前記得再摸一下口袋：證件、鑰匙、充電線。';$('list').append(msg);}}
$('addDestination').addEventListener('click',()=>{const name=$('newDestination').value.trim();if(!name)return;if([...baseDestinations,...customDestinations].some(x=>x.toLocaleLowerCase()===name.toLocaleLowerCase())){$('status').textContent='這個目的地已經在清單裡。';return;}if(customDestinations.length>=30){$('status').textContent='最多可新增 30 個自訂目的地。';return;}customDestinations.push(name);try{localStorage.setItem(destinationKey,JSON.stringify(customDestinations));}catch{}const o=document.createElement('option');o.value=name;o.textContent=name;$('destination').append(o);$('destination').value=name;$('newDestination').value='';$('status').textContent=`已新增「${name}」，現在可以產生清單。`;});$('newDestination').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('addDestination').click();}});$('addPurpose').addEventListener('click',()=>{const name=$('newPurpose').value.trim();if(!name)return;if([...Object.values(basePurposes),...customPurposes.map(p=>p.name)].some(x=>x.toLocaleLowerCase()===name.toLocaleLowerCase())){$('status').textContent='這個出遊目的已經在清單裡。';return;}if(customPurposes.length>=30){$('status').textContent='最多可新增 30 個自訂出遊目的。';return;}const purpose={id:'custom-'+Date.now(),name};customPurposes.push(purpose);const o=document.createElement('option');o.value=purpose.id;o.textContent=name;$('purpose').append(o);try{localStorage.setItem(purposeKey,JSON.stringify(customPurposes));}catch{}$('purpose').value=purpose.id;$('newPurpose').value='';$('status').textContent=`已新增「${name}」，現在可以產生清單。`;});$('newPurpose').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('addPurpose').click();}});$('tripForm').addEventListener('submit',event=>{event.preventDefault();if(state.items.some(x=>x.done||x.group==='自訂物品')&&!confirm('建立新清單會清除目前的勾選與自訂物品，要繼續嗎？'))return;state=create(formTrip());save();render();$('status').textContent='已依新行程產生清單。';});$('remaining').addEventListener('change',render);$('addForm').addEventListener('submit',event=>{event.preventDefault();const name=$('custom').value.trim();if(!name)return;state.items.push({id:'custom-'+Date.now(),group:'自訂物品',name,done:false});$('custom').value='';save();render();$('status').textContent='已加入：'+name;});$('print').addEventListener('click',()=>window.print());$('copy').addEventListener('click',async()=>{const text=[`${state.trip.destination} ${state.trip.days} 天打包清單`,...state.items.map(x=>`${x.done?'☑':'☐'} ${x.name}`)].join('\n');try{await navigator.clipboard.writeText(text);$('status').textContent='已複製，可貼到訊息或筆記。';}catch{$('status').textContent='瀏覽器無法自動複製，請選取清單文字後複製，或使用列印。';}});render();
</script>
</html>
