const baseDestinations='基隆市 臺北市 新北市 桃園市 新竹市 新竹縣 苗栗縣 臺中市 彰化縣 南投縣 雲林縣 嘉義市 嘉義縣 臺南市 高雄市 屏東縣 宜蘭縣 花蓮縣 臺東縣 澎湖縣 金門縣 連江縣'.split(' '),destinationKey='pack-go-destinations-v1';let customDestinations=[];try{const ds=JSON.parse(localStorage.getItem(destinationKey));if(Array.isArray(ds))customDestinations=ds.filter(x=>typeof x==='string').slice(0,30);}catch{}customDestinations.filter(x=>!baseDestinations.includes(x)).forEach(x=>{const o=document.createElement('option');o.textContent=x;o.value=x;document.getElementById('destination').append(o);});const basePurposes={city:'城市旅遊',business:'商務出差',hiking:'戶外健行'},purposeKey='pack-go-purposes-v1';let customPurposes=[];try{const ps=JSON.parse(localStorage.getItem(purposeKey));if(Array.isArray(ps))customPurposes=ps.filter(p=>p&&typeof p.id==='string'&&typeof p.name==='string').slice(0,30);}catch{}function purposeName(id){return basePurposes[id]||customPurposes.find(p=>p.id===id)?.name||'自訂行程';}customPurposes.forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=p.name;$('purpose').append(o);});try{const saved=JSON.parse(localStorage.getItem(key));if(saved&&saved.trip&&Array.isArray(saved.items)&&saved.items.every(x=>typeof x.name==='string'&&typeof x.group==='string')&&['cool','hot','cold','rain'].includes(saved.trip.weather)&&(Object.hasOwn(basePurposes,saved.trip.purpose)||customPurposes.some(p=>p.id===saved.trip.purpose))&&Number.isInteger(saved.trip.days)&&saved.trip.days>=1&&saved.trip.days<=30)state=saved;}catch{}if(!state){$('purpose').value='city';$('destination').value='';state=create({...formTrip(),destination:'請選擇目的地'});}for(const id of ['destination','days','purpose','weather'])$(id).value=state.trip[id];

function render(){const active=state.items.filter(x=>!x.skipped),done=active.filter(x=>x.done).length,total=active.length,percent=total?Math.round(done/total*100):100;$('tripTitle').textContent=tr('trip',{destination:state.trip.destination,days:state.trip.days,nights:state.trip.days-1});$('tripDetail').textContent=`${purposeName(state.trip.purpose)} ／ ${tr('weatherSummary')[state.trip.weather]}`;$('progress').textContent=total===0?tr('skipped'):done===total?tr('ready'):tr('done',{done,total});$('fill').style.width=percent+'%';document.querySelector('[role=progressbar]').setAttribute('aria-valuenow',percent);$('list').replaceChildren();const visible=state.items.filter(x=>!$('remaining').checked||(!x.done&&!x.skipped));for(const group of [...new Set(visible.map(x=>x.group))]){const section=document.createElement('section');section.className='group'+(group.startsWith('出門前')?' critical':'');const heading=document.createElement('h3');heading.textContent=groupKeys[group]?tr(groupKeys[group]):group;section.append(heading);for(const item of visible.filter(x=>x.group===group)){const label=document.createElement('label');label.className='item'+(item.done?' done':'')+(item.skipped?' skipped':'');const check=document.createElement('input');check.type='checkbox';check.checked=item.done;check.addEventListener('change',()=>{item.done=check.checked;save();render();});const span=document.createElement('span');span.textContent=item.itemKey?tr(item.itemKey):item.name;label.append(check,span);if(['衣物與盥洗','天氣準備','隨身小物'].includes(group)){const skip=document.createElement('button');skip.type='button';skip.className='skip-item'+(item.skipped?' restore':'');skip.textContent=item.skipped?'＋':'−';skip.setAttribute('aria-label',item.skipped?tr('restore')+' '+span.textContent:tr('noNeed')+' '+span.textContent);skip.title=item.skipped?tr('restore'):tr('noNeed');skip.addEventListener('click',()=>{item.skipped=!item.skipped;if(item.skipped)item.done=false;save();render();});label.append(skip);}section.append(label);}$('list').append(section);}if(!visible.length){const msg=document.createElement('p');msg.className='empty';msg.textContent=tr('none');$('list').append(msg);}}
$('addDestination').addEventListener('click',()=>{const name=$('newDestination').value.trim();if(!name)return;if([...baseDestinations,...customDestinations].some(x=>x.toLocaleLowerCase()===name.toLocaleLowerCase())){$('status').textContent=tr('duplicateDestination');return;}if(customDestinations.length>=30){$('status').textContent=tr('destinationLimit');return;}customDestinations.push(name);try{localStorage.setItem(destinationKey,JSON.stringify(customDestinations));}catch{}const o=document.createElement('option');o.value=name;o.textContent=name;$('destination').append(o);$('destination').value=name;$('newDestination').value='';$('status').textContent=tr('destinationAdded',{name});});$('newDestination').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('addDestination').click();}});$('addPurpose').addEventListener('click',()=>{const name=$('newPurpose').value.trim();if(!name)return;if([...Object.values(basePurposes),...customPurposes.map(p=>p.name)].some(x=>x.toLocaleLowerCase()===name.toLocaleLowerCase())){$('status').textContent=tr('duplicatePurpose');return;}if(customPurposes.length>=30){$('status').textContent=tr('purposeLimit');return;}const purpose={id:'custom-'+Date.now(),name};customPurposes.push(purpose);const o=document.createElement('option');o.value=purpose.id;o.textContent=name;$('purpose').append(o);try{localStorage.setItem(purposeKey,JSON.stringify(customPurposes));}catch{}$('purpose').value=purpose.id;$('newPurpose').value='';$('status').textContent=tr('purposeAdded',{name});});$('newPurpose').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('addPurpose').click();}});$('tripForm').addEventListener('submit',event=>{event.preventDefault();if(state.items.some(x=>x.done||x.group==='自訂物品')&&!confirm(tr('reset')))return;state=create(formTrip());save();render();$('status').textContent=tr('generated');});$('remaining').addEventListener('change',render);$('addForm').addEventListener('submit',event=>{event.preventDefault();const name=$('custom').value.trim();if(!name)return;state.items.push({id:'custom-'+Date.now(),group:'自訂物品',name,done:false});$('custom').value='';save();render();$('status').textContent=tr('itemAdded',{name});});$('print').addEventListener('click',()=>window.print());$('copy').addEventListener('click',async()=>{const text=[`${state.trip.destination} ${state.trip.days} 天打包清單`,...state.items.map(x=>`${x.done?'☑':'☐'} ${x.name}`)].join('\n');try{await navigator.clipboard.writeText(text);$('status').textContent=tr('copyOk');}catch{$('status').textContent=tr('copyFail');}});$('langZh').addEventListener('click',()=>{language='zh';localStorage.setItem(langKey,language);applyLanguage();});$('langEn').addEventListener('click',()=>{language='en';localStorage.setItem(langKey,language);applyLanguage();});applyLanguage();
</script>
</html>
